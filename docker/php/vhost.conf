<VirtualHost *:80>
        ServerName  folio.local.com
        DocumentRoot /var/www/html/templates
        ErrorLog /var/log/apache2/folio.log
        TransferLog /var/log/apache2/folio.log

        <Directory  "/var/www/html/templates">
            Options Indexes FollowSymLinks
            AllowOverride All
            Order deny,allow
            Allow from all
            Require all granted
        </Directory>
</VirtualHost>
